<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Archive - Naman Pratulya</title>
    <link rel="icon" href="/site-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="author" content="Naman Pratulya" />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body data-barba="wrapper" class="page-wrap">

    <!-- page transition -->
    <div class="transition">
      <div class="transition-overlay"></div>
    </div>

    <!-- menu -->
    <nav class="nav-wrap u-position-fixed">
      <div class="nav-contain u-container-full">
        <a class="u-mobile-hidden" href="/work">work</a>
        <a href="/" class="u-text-style-font-secondary">naman pratulya</a>
        <a class="u-mobile-hidden" href="/contact">contact</a>

        <div class="menu-toggle-btn">
          <div class="menu-toggle-btn-wrapper">
            <a>MENU</a>
          </div>
        </div>
      </div>
    </nav>

    <div class="bottom-nav-wrap u-position-fixed u-container-full u-mobile-hidden">
      <div class="bottom-nav-contain">
        <a href="/archive">archive</a>
        <a id="time">12:34:56 IST</a>
      </div>
    </div>

    <div class="menu-wrap">
      <div class="menu-content u-container-full">
        <div class="menu-box">
          <div class="menu-items">
            <a class="menu-item" href="/work" data-animate="font-weight"><h1>Work</h1></a>
            <a class="menu-item" href="/archive" data-animate="font-weight"><h1>Archive</h1></a>
            <a class="menu-item" href="/contact" data-animate="font-weight"><h1>Contact</h1></a>
          </div>
          <line></line>
          <div class="menu-footer">
            <div class="menu-footer-item">
              <a href="https://www.instagram.com/namanprat/" target="_blank">Instagram</a>
              <a href="mailto:npratulya@gmail.com" target="_blank">Email</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <main data-barba="container" data-barba-namespace="archive">

      <section id="gallery"></section>

      <!-- Grid controls (outside overlay so they're always visible) -->
      <div class="archive-grid-controls">
        <div class="archive-control-group">
          <label for="grid-size-slider">Grid: </label>
          <input type="range" id="grid-size-slider" min="0.2" max="2.0" step="0.1" value="0.5" />
          <span id="grid-size-value" class="control-value">0.5</span>
        </div>
        <div class="archive-control-group">
          <label for="line-thickness-slider">Line: </label>
          <input type="range" id="line-thickness-slider" min="0.01" max="0.1" step="0.01" value="0.03" />
          <span id="line-thickness-value" class="control-value">0.03</span>
        </div>
      </div>

      <div id="archive-overlay" class="archive-overlay">
        <div class="archive-header">
          <h2 id="archive-title">Title</h2>
        </div>

        <div class="archive-nav-wrap u-center-fixed u-container-full">
          <div class="archive-nav-contain">
            <button id="archive-prev" class="nav-btn u-radius-round">&larr;</button>
            <button id="archive-next" class="nav-btn u-radius-round">&rarr;</button>
          </div>
        </div>
      </div>

    </main>

    <script type="module" src="/scripts/barba.js"></script>

  </body>
</html>
