<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duforn | Page Not Found</title>
    <link rel="icon" href="/site-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noindex" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1e1e1e;
        color: #e2e2e2;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-transform: uppercase;
        letter-spacing: 0.035em;
      }
      .container {
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      h1 {
        font-size: 4rem;
        font-weight: 400;
      }
      p {
        font-size: 0.875rem;
        opacity: 0.6;
      }
      a {
        color: #e2e2e2;
        text-decoration: none;
        border: 1px solid currentColor;
        padding: 0.75rem 2rem;
        font-size: 0.875rem;
        display: inline-block;
        transition: opacity 0.2s;
      }
      a:hover {
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <p>Page not found</p>
      <a href="/">Back to home</a>
    </div>
  </body>
</html>
